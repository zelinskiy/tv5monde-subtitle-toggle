<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Subtitle Settings</title>
  <style>
    body { font-family: sans-serif; padding: 12px; width: 220px; }
    .field { margin-bottom: 10px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 0.85em; }
    select { width: 100%; padding: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 7px; background: #007bff; color: white; border: none; cursor: pointer; font-size: 0.9em; }
    button:hover { background: #0056b3; }
    #status { margin-top: 6px; color: green; font-size: 0.8em; text-align: center; }
    #warning { color: #d9534f; font-size: 0.75em; margin-bottom: 8px; line-height: 1.2; }
  </style>
</head>
<body>
  <h4 style="margin: 0 0 10px 0;">Subtitle Settings</h4>
  <div id="warning"></div>
  
  <div class="field">
    <label for="primaryLang">Primary Language:</label>
    <select id="primaryLang">
      <option value="">Loading...</option>
    </select>
  </div>

  <div class="field">
    <label for="secondaryLang">Secondary Language:</label>
    <select id="secondaryLang">
      <option value="">Loading...</option>
    </select>
  </div>

  <button id="save">Save Settings</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
